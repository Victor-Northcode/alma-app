  - article [ref=f3e14]:
    - generic [ref=f3e15]: Alma · Pazl LLC
    - heading "Privacy" [level=1] [ref=f3e16]
    - generic [ref=f3e17]: Last updated 7 August 2026
    - paragraph [ref=f3e18]: This is a plain-language summary of how Alma actually works, prepared for review. It is not final legal advice, and it has not yet been checked against the law of every country Alma is sold in. Where a fact is not settled it is left visibly blank rather than filled in.
    - paragraph [ref=f3e20]: Alma is built on the most personal numbers you have. Here is every one of them we hold, everywhere they go, and how to take them back.
    - generic [ref=f3e21]:
      - heading "What Alma holds" [level=2] [ref=f3e22]
      - paragraph [ref=f3e23]: "All of it. Nothing on this list is optional to disclose:"
      - list [ref=f3e24]:
        - listitem [ref=f3e25]: Your email address, once you have given us one. It is your account and it is how you sign in; until then there is a row with an id and no address on it, which is what reading Alma without signing in actually is. On this website that row is created the moment you save your birth data or sign in, and not before — reading the page, or starting the questions and closing the tab, creates nothing. In the apps it is created when the app first reaches the server, because everything the app can show you is already something it has to ask for on your behalf.
        - listitem [ref=f3e26]: Your birth date.
        - listitem [ref=f3e27]: Your birth time, if you gave one. You can use Alma without it; some of the chart is unavailable until you do.
        - listitem [ref=f3e28]: Your birth place, stored as coordinates and the time zone they fall in.
        - listitem [ref=f3e29]: Your name, if you gave one. Alma works without it.
        - listitem [ref=f3e30]: The readings Alma generated for you.
        - listitem [ref=f3e31]: Your conversations with Alma.
        - listitem [ref=f3e32]: A small memory of facts you stated about yourself in those conversations, so you do not have to repeat them.
        - listitem [ref=f3e33]: "Counters: how many readings were written for your account on a given day, how many questions you asked, and what those generations cost us. Two things in the same table are not counts and are worth naming: whether you have been shown the one cheaper offer we are allowed to show after a refusal, and which renewal letters were sent to you and when. They hold numbers, dates and single words — never text of yours."
        - listitem [ref=f3e34]: The exact sentences you ticked at a checkout, with the language you read them in and the moment you ticked — where there was a checkout. Buying inside an app is a purchase sheet belonging to Apple or Google, which asks you to tick nothing on our behalf, so nothing of this kind is recorded for it. Where the record does exist it is the reason the confirmation in your inbox can quote your consent back instead of paraphrasing it, and it is what the law asks us — not you — to be able to prove. A checkout opened and never paid for leaves a record that is deleted with your account, because it is evidence of nothing.
        - listitem [ref=f3e35]: "A sign-in link you asked for: the address it was sent to, when it was made, when it expires and whether it has been used. It holds no password, because there is none."
        - listitem [ref=f3e36]: What you bought, when, in which currency, and the id the payment processor gave it. Not your card — that never reaches us.
        - listitem [ref=f3e37]: "Which steps of the product were reached: the landing opened, the quiz started, the quiz finished, the portrait seen — and, in the apps, the paywall shown and the purchase made. Short labels, never a page address, a referrer, an IP address, a user agent, or anything you typed — the code that writes these refuses any field that is not on a short list of words describing the product rather than the person."
        - listitem [ref=f3e38]: "A random id for your browser, or for your copy of the app, kept with those step labels. It is the answer to one question — of the people who opened the landing, how many finished — which cannot be asked without some way of telling one visit from another, and which we would otherwise have answered by creating an account for you before you had done anything. It is a random string and nothing more: not built from your device, your screen, your address or anything else about you, and it signs you into nothing. If you later save a birth or sign in, it is attached to the account created at that moment, so that the steps you took before it existed are still yours. Clearing this site’s data removes it, deleting the app removes it, and it is replaced with a new one after 180 days in any case. In a browser, if yours sends Do Not Track or Global Privacy Control, none of it is created in the first place — no id is stored and no step label is sent. In the Android app the same switch is in Settings. On iPhone there is no such switch yet, so the id is created there on first launch; nothing else about what is collected differs."
        - listitem [ref=f3e39]: An identifier for your phone, if — and only if — you turn on the daily notification. It is issued by Apple or Google, not by us; it is what a notification is addressed to, and there is no way to send you one without it. It is held while the daily is switched on and deleted the moment you switch it off, the moment your phone tells us the permission is gone, and with your account. If you simply stop opening the app it is deleted anyway after ninety days, and we stop sending after sixty. It is not an advertising identifier, it is never joined with anyone else’s data, and it is the one thing on this list your export does not contain — it is a live key to your phone, and making copies of it to prove we hold it would be the opposite of the point. The export names the device instead.
      - paragraph [ref=f3e40]: Sign-in is passwordless. There is no password field anywhere in Alma, so there is no password stored, no password to leak, and no password of yours that a breach somewhere else can be tried against.
    - generic [ref=f3e41]:
      - heading "Why each of them exists" [level=2] [ref=f3e42]
      - paragraph [ref=f3e43]: The birth date, time and place are the calculation. Without them there is no chart, and without a chart there is nothing to read — this is the whole of what Alma does, not a convenience.
      - paragraph [ref=f3e44]: The email address is the account. The readings and conversations are the thing you paid for and came back for. The memory exists so that Alma does not ask you the same question in March that you answered in January.
      - paragraph [ref=f3e45]: The counters exist because a free tier has to be countable and a generation costs us real money; they are read to answer “has this account had its three questions today” and nothing else.
      - paragraph [ref=f3e46]: The step labels are how we find out where people give up — whether the quiz is too long, whether the offer arrives too early. That question is about the product, so the answer is kept as words about the product.
      - paragraph [ref=f3e47]: "Nothing here is collected to build a profile of you for anyone else. There is no third-party analytics in Alma, no advertising tag, and nobody outside the companies named below receives anything about you: what we count, we count in our own database. If your browser sends Do Not Track or Global Privacy Control, the step labels are not recorded at all and the random id is never created — that is checked on every one of them rather than once when the page loads, so turning it on mid-session works, and the id is only ever written by the same code that has just checked."
    - generic [ref=f3e48]:
      - heading "What leaves the service" [level=2] [ref=f3e49]
      - paragraph [ref=f3e50]: Four companies at most, depending on where you bought, and this is the complete list. Only one of them ever takes a payment from you, and it is a store.
      - list [ref=f3e51]:
        - listitem [ref=f3e52]:
          - strong [ref=f3e53]: Anthropic
          - text: generates the readings. What is sent is the calculated chart — positions, aspects, the numbers — the question you asked, and the short facts Alma remembers about you, because a reading that has forgotten what you said in January is the thing you are paying not to get. That last part is free text you typed, which makes it the most personal item on this list and the reason it is named here rather than folded into “the chart”. Your email address is not needed for any of it and is not part of it.
        - listitem [ref=f3e54]:
          - strong [ref=f3e55]: Google and Apple
          - text: take the payments. Everything is bought
          - emphasis [ref=f3e56]: inside the apps
          - text: ": on iPhone and iPad the seller is Apple; on Android it is Google. Your card details go to the store and never touch Alma, the receipt comes from them, and cancelling a subscription happens in their account settings rather than in ours. What travels the other way is one identifier: when you buy, the app hands us the store’s purchase token and we ask the store to confirm it, because an app that unlocked a reading on its own word could be made to unlock it for nothing. That confirmation names the product and the order, not you. See the"
          - link "refund policy" [ref=f3e57] [cursor=pointer]:
            - /url: /refunds
          - text: for what all of that means when you want money back.
        - listitem [ref=f3e58]:
          - strong [ref=f3e59]: Paddle.com Market Ltd
          - text: "is the card processor Alma is configured with, and it is listed here for completeness rather than because it has your data: nothing is sold on this website, both apps bill through their store, and no purchase reaches this company today. If one ever did — the seam is still shipped and still selectable — they would take the payment and hold the money on exactly the terms above, and your card details would go to them rather than to us."
        - listitem [ref=f3e60]:
          - strong [ref=f3e61]: Resend
          - text: "carries every email Alma sends: the sign-in link, the notice three days before a subscription renews, and the written confirmation of a purchase. They receive your address and what is in the letter — for the renewal notice, that is a date and an amount. There is no fourth kind: Alma has no newsletter, no campaign and no list, and every message it sends is tied to something you did or to money about to leave your account."
      - paragraph [ref=f3e62]:
        - text: "Where those companies hold data, and under which transfer terms, is being confirmed:"
        - generic [ref=f3e63]: "[data transfer terms per processor]"
        - text: . Alma itself is hosted in
        - generic [ref=f3e64]: "[hosting region]"
        - text: .
    - generic [ref=f3e65]:
      - heading "What Alma never does" [level=2] [ref=f3e66]
      - paragraph [ref=f3e67]: Alma does not sell your personal information, and does not share it for advertising or cross-context behavioural advertising. There is no opt-out link on this page because there is nothing to opt out of. If that ever changes, it changes here first, and the address on your account is written to before it takes effect — by a person, because Alma has no mailing list and nothing automatic that could send it. An account that has never given us an address cannot be written to at all, which is the honest end of that sentence.
      - paragraph [ref=f3e68]: Your readings are not used to train anyone’s model, and your conversations are not read for product research.
    - generic [ref=f3e69]:
      - heading "Cookies" [level=2] [ref=f3e70]
      - paragraph [ref=f3e71]:
        - text: "Alma sets one cookie:"
        - code [ref=f3e72]: alma.locale
        - text: ", which remembers the language you picked so the page arrives in it rather than flickering into it. It holds a language code and nothing else."
      - paragraph [ref=f3e73]: Your sign-in token is kept in your browser’s local storage rather than a cookie. It is sent to Alma and to nowhere else. Signing out removes it.
      - paragraph [ref=f3e74]:
        - text: The random id described above is kept in the same place, under
        - code [ref=f3e75]: alma.anon
        - text: ", with the date it was made beside it. It is not a cookie either, it is sent to Alma and to nowhere else, and it is never created if your browser sends Do Not Track or Global Privacy Control. Clearing this site’s data removes it, deleting your account removes it, and your browser replaces it with a new one once it is 180 days old — so the string itself does not outlive the records it was keeping. In the apps it lives in the same kind of ordinary storage, and it is deliberately not kept anywhere a bearer credential is kept: it authorises nothing."
      - paragraph [ref=f3e76]: There are no advertising cookies and no third-party cookies to manage. If sign-in with Google or Apple is ever switched on, their script is loaded on the sign-in screen and they become a fourth recipient — of the fact that you signed in, and of nothing else. It is off in this build, and this sentence is here because one configuration value is all it takes to make the paragraph above it incomplete.
    - generic [ref=f3e77]:
      - heading "Taking it back" [level=2] [ref=f3e78]
      - paragraph [ref=f3e79]: Both of these live in Settings and both happen immediately. Neither of them requires writing to us, and there is no retention offer in the way.
      - paragraph [ref=f3e80]:
        - text: They work for an account you never signed into. Alma creates one on the server the first time an app talks to it, before any sign-in screen, and that account is where your birth data lives — so it can be exported and deleted on exactly the same terms, confirmed with the account id shown on the screen instead of an address you never gave. If the Settings screen in front of you asks you to sign in before it will do either, that app has not caught up with this; write to
        - link "hello@pazl.ai" [ref=f3e81] [cursor=pointer]:
          - /url: mailto:hello@pazl.ai
        - text: and we will do it by hand. That is a person and a working day, not a form, and we would rather say so than let a button imply otherwise.
      - list [ref=f3e82]:
        - listitem [ref=f3e83]:
          - strong [ref=f3e84]: Export.
          - text: "One JSON file: your account, every profile with its birth data, what you bought, every reading, every conversation and everything Alma remembers."
        - listitem [ref=f3e85]:
          - strong [ref=f3e86]: Deletion.
          - text: Your birth data, your readings, your conversations, your memory, your entitlements and any phone registered for the daily are deleted outright — rows removed, not a flag set on rows that stay.
      - paragraph [ref=f3e87]: "Two things survive, and they are worth naming rather than leaving for you to find. The payment records stay, because a record of a sale is a legal obligation and it is the other side of somebody else’s books as well as ours — but your account is detached from them and the processor’s own message about the payment, which used to sit beside them holding your name and address, is wiped. What is left is what an accountant needs: a date, an amount, a currency, a country and the processor’s reference. And a stub of the account row stays, with your address and name removed, so that a sign-in link clicked a minute later gets a clear answer instead of a confusing error."
      - paragraph [ref=f3e88]: "A third record survives that was never ours to delete: the store’s own. If you bought through Google Play or the App Store, they keep their record of that purchase under their own policy, in your account with them, and nothing we do here reaches it."
      - paragraph [ref=f3e89]: The counters, the step labels and any sign-in link ever sent to your address go with everything else. They used to survive, and this page used to disclose that instead of fixing it. That includes the steps recorded before your account existed — the landing you opened and the quiz you started are yours, even though at the time there was nothing of yours to file them under.
      - paragraph [ref=f3e90]: You can also correct your birth data at any time. A corrected time is a different chart, so a chapter opened afterwards is written again from the new one rather than showing you the old text; what was written from the old chart stays stored until you delete your account.
    - generic [ref=f3e91]:
      - heading "How long it is kept" [level=2] [ref=f3e92]
      - paragraph [ref=f3e93]: While your account exists. When you delete it, it goes from the live database at once and ages out of encrypted backups within 30 days, after which it is gone from there too. That window is the one place where deleted data survives for a while, and the one thing on this page a person cannot verify from the outside.
      - paragraph [ref=f3e94]: "The step labels and the browser id are the exception: they are deleted after 180 days whether or not there is an account, and whether or not anybody has asked. All of them from the same period go together, so what is left is always a complete picture of a period rather than a flattering part of one. The id in your browser or your phone goes on the same clock: it is replaced with a fresh one once it reaches that age, so the same person cannot be recognised under the same string in a later year. That is the half of this promise that used to be missing — the records expired and the identifier did not."
    - generic [ref=f3e95]:
      - heading "Age" [level=2] [ref=f3e96]
      - paragraph [ref=f3e97]:
        - text: Alma is for people aged 16 and over. If you are younger, do not use it, and if you have already given us your birth data, write to
        - link "hello@pazl.ai" [ref=f3e98] [cursor=pointer]:
          - /url: mailto:hello@pazl.ai
        - text: and it will be deleted without argument.
    - generic [ref=f3e99]:
      - heading "Your rights, and the short way to use them" [level=2] [ref=f3e100]
      - paragraph [ref=f3e101]: Depending on where you live, you have the right to see your data, correct it, take it elsewhere, and have it deleted. Export and deletion in Settings are the fastest route to all four, and they do not require you to prove anything to anyone.
      - paragraph [ref=f3e102]:
        - text: That includes an account you never signed into. Alma creates one on the server the first time the app talks to it, and it holds your birth data whether or not you ever gave us an address — so it can be exported and deleted from Settings on exactly the same terms. The step-by-step is on
        - link "the deletion page" [ref=f3e103] [cursor=pointer]:
          - /url: /delete-account
        - text: ", which also covers what to do if the app is already gone from your phone."
      - paragraph [ref=f3e104]:
        - text: For anything they do not cover, write to
        - link "hello@pazl.ai" [ref=f3e105] [cursor=pointer]:
          - /url: mailto:hello@pazl.ai
        - text: . The controller is Pazl LLC; the supervisory authority you may complain to is
        - generic [ref=f3e106]: "[lead supervisory authority]"
        - text: .
    - generic [ref=f3e107]:
      - text: If a sentence on this page is unclear, that is our fault, not yours. Write to
      - link "hello@pazl.ai" [ref=f3e108] [cursor=pointer]:
