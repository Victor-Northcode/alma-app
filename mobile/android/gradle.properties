# 4 GB rather than the 2 GB default: Compose compilation on a codebase of this
# shape spends most of its time in the Kotlin compiler daemon, and the symptom
# of too little heap is a build that gets slower and then dies rather than one
# that says it ran out of memory.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
