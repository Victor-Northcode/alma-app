# The one place the version people see is written.
#
# Read by mobile/android/release.sh and mobile/ios/release.sh, and by
# mobile/android/app/build.gradle.kts so that a hand-run `./gradlew` picks up
# the same string. Xcode has no equivalent hook, so the iOS release script
# passes it to `xcodebuild` as MARKETING_VERSION on the command line; the
# 1.0 sitting in the .pbxproj is only what an unscripted build in the Xcode UI
# produces.
#
# This is the *marketing* version — the "1.0.2" a customer reads on the store
# page. It is edited by a human, deliberately, and it is the only number in
# this project that is. The build number underneath it is not written here
# because it is not remembered: both release scripts compute it as the number
# of whole minutes elapsed since 2026-01-01T00:00:00Z. See mobile/RELEASE.md,
# "The two numbers", for why that beats a counter somebody has to increment.

MARKETING_VERSION=1.0.0
