name: alma
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fixnum: ^1.1.1
  http: ^1.6.0
  # Магазин. Один пакет на обе платформы: StoreKit на iOS, Play Billing на
  # Android — ровно то, что на нативе делают AlmaStore.swift и BillingClient.
  in_app_purchase: ^3.2.4
  # Выгрузка данных: файл кладётся во временную папку и отдаётся системному
  # листу «поделиться» — ровно то, что делает ShareLink на нативе. Держать
  # копию аккаунта внутри контейнера приложения значило бы завести второе
  # место, где живут те же данные.
  # Связка ключей iOS и Keystore на Android. Токен, лежащий в
  # shared_preferences, умирает вместе с установкой — вместе с ним умирают и
  # покупки безымянного гостя, которому сервер не имеет способа их вернуть.
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  # Системный вопрос про уведомления — один пакет на обе платформы.
  #
  # **Почему не `firebase_messaging`.** `docs/PUSH.md §2.1` разбирает это
  # решением, а не вкусом: на Android FCM безальтернативен, на iOS — нет, и
  # гонять iOS через FCM значило бы поставить Google между нами и Apple ради
  # одного общего пути отправки. Бэкенд ходит в APNs напрямую (`ALMA_APNS_*`),
  # токен устройства даёт сама iOS, и Firebase здесь нечего делать. Вдобавок
  # `firebase_messaging` не собирается без `google-services.json` и
  # `GoogleService-Info.plist`, а проекта Firebase ещё нет — он в списке
  # владельца (`PUSH.md §9` шаг 7).
  #
  # **Почему не своей обвязкой.** На iOS разрешение — одна строка
  # `UNUserNotificationCenter`, и своя обвязка там была бы дешевле пакета. На
  # Android 13 это настоящее runtime-разрешение с `ActivityResultLauncher`,
  # различением «отказал» и «отказал навсегда» и дорогой ценой ошибки: §5.5
  # напоминает, что второй попытки система не даёт. Такое писать руками
  # незачем.
  #
  # `flutter_local_notifications` не взят: локальных уведомлений продукт не
  # показывает вовсе — всё рисует система по пушу с сервера. Он понадобится
  # ровно тогда, когда появится канал `alma.daily` для Android (§6.2.5).
  permission_handler: ^13.0.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Собирает семь .arb в один класс L. Без этого флага lib/l10n лежит мёртвым
  # грузом, а экраны начинают писать строки прямо в коде — с чего расхождение
  # платформ и началось в прошлый раз.
  generate: true

  # **Шрифты вшиты, а не скачиваются.** `typography.dart` звал «Playfair
  # Display» и «Golos Text» по имени с первого дня, но файлов в приложении не
  # было — и iOS молча подставлял New York и системный SF. Экран выглядел
  # «почти правильно», отчего расхождение с эталоном и не было заметно.
  #
  # Файлы вариативные, по одному на начертание: одна ось `wght`, весь диапазон
  # 400–900 внутри. Это меньше набора отдельных весов и позволяет брать
  # промежуточные значения. Кириллица, latin-ext, «ё» и кавычки-ёлочки на
  # месте — сабсеттинг не делался, иначе развалились бы шесть локалей из семи.
  #
  # Вариативный шрифт во Flutter не выбирает вес сам по `fontWeight`: файл
  # отдаёт своё умолчание, пока ось не задана явно. Поэтому вес ставится
  # `fontVariations: [FontVariation('wght', N)]` — см. `AlmaType._w`.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Variable.ttf

  # **В бандл едет только то, что нужно до первой сети.**
  #
  # Из 445 МБ оригиналов дизайн-пакета здесь четыре: небо, восемь карт систем и
  # пять картин продающего слоя. Небо стоит на всех сорока восьми эталонных
  # экранах, карты — колода «Мои системы» и герои дверей, продающий слой
  # встречается на первом же пейволле, который видит новый человек, — то есть
  # раньше, чем он согласится чего-то ждать.
  #
  # Золочёная бумага прожила здесь один день и снята: владелец, посмотрев главу
  # на снимке листа в раме, попросил простой светлый фон. Полтора мегабайта
  # вернулись, а с ними — правило «гоним из полноразмерного оригинала» без
  # единого исключения: она была единственной картинкой, у которой оригинала не
  # было вовсе.
  #
  # Сорока вклеек глав здесь нет намеренно: они нужны в момент открытия главы,
  # то есть заведомо после сети, и приезжают с бэкенда с кэшем. Это половина
  # веса, которую незачем носить с собой.
  #
  # WebP q80 под настоящий размер на экране, три масштаба. Размер считается от
  # логической ширины: небо от 440 точек — самый широкий телефон; карта
  # от 280 — ширина карты-героя, а не карты в колоде, чтобы один файл работал в
  # обоих местах. Полный набор — 4,1 МБ; те же картинки в PNG «как есть» весили
  # бы 111.
  assets:
    - assets/img/
    - assets/img/2.0x/
    - assets/img/3.0x/

  # To add assets to your application, add an assets section, like this:
  #   - images/a_dot_burr.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
