# Обратный прокси перед Alma — вариант для тех, у кого уже стоит nginx.
#
# **По умолчанию compose поднимает Caddy, а не это** (см. `docker-compose.yml`,
# служба `proxy`): Caddy сам получает и продлевает сертификат, nginx — нет. Этот
# файл делает ровно то же самое и нужен, если nginx на машине уже есть и держит
# другие сайты.
#
# Куда класть: /etc/nginx/sites-available/alma, затем симлинк в sites-enabled,
# `nginx -t`, `systemctl reload nginx`.
#
# Сертификат — certbot:
#     apt install certbot python3-certbot-nginx
#     certbot --nginx -d api.example.com
# Certbot допишет пути к сертификатам сам и заведёт таймер продления. Проверить,
# что таймер жив, командой `systemctl list-timers | grep certbot`, — просроченный
# сертификат на девяностый день это ровно то, что происходит, если не проверить.

# Настоящий адрес клиента, если перед nginx стоит ещё и Cloudflare. Без этого
# `$remote_addr` — это адрес Cloudflare, и все посетители мира складываются в
# один ключ потолка по источнику (`api/deps.request_source`).
# Список сетей: https://www.cloudflare.com/ips/ — он меняется, и это единственная
# строка здесь, которую надо иногда обновлять.
# set_real_ip_from 173.245.48.0/20;
# real_ip_header CF-Connecting-IP;

upstream alma_app {
    # `app:8000` внутри сети compose; 127.0.0.1:8000, если nginx на хосте, а
    # приложение опубликовало порт наружу.
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP существует ровно для двух вещей: проверки ACME и перенаправления на TLS.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Тела запросов у нас маленькие (дата рождения, вопрос в чате). Мегабайт —
    # это с запасом, и он же — предел, ниже которого попытка что-то залить
    # упирается в отказ, а не в память.
    client_max_body_size 1m;

    # ── вклейки глав: отдаёт nginx, приложение не будит ─────────────────────
    #
    # Каждая картинка, прошедшая через приложение, занимает воркера gunicorn на
    # время передачи по мобильной сети — на секунды, — и ровно этого воркера не
    # хватает тому, кто в этот момент ждёт главу. Здесь это стоит нуля.
    #
    # `immutable`: содержимое под именем неизменно, новая картинка приезжает
    # новым `?v=` в ссылке (`api/plates.py`), поэтому браузер может не
    # спрашивать про неё год.
    location /static/plates/ {
        alias /srv/alma/backend/static/plates/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── поток стадий ────────────────────────────────────────────────────────
    #
    # `/v1/chat/stream` — SSE: стадии («считаю карту», «пишу») уходят читателю
    # по мере того, как случаются, а пауза между двумя стадиями — это модель,
    # которая думает, то есть до трёх минут (`ai/provider.py`).
    #
    # Умолчания nginx ломают это дважды:
    #   • `proxy_buffering on` копит ответ и отдаёт целиком — читатель видит
    #     пустой экран всю генерацию, а потом всё сразу; смысл потока стадий
    #     ровно в том, чтобы этого не было;
    #   • `proxy_read_timeout 60s` читает тишину дольше минуты как обрыв и
    #     закрывает соединение посреди оплаченной генерации.
    location /v1/chat/stream {
        proxy_pass http://alma_app;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;
        # Для промежуточных кэшей — то же самое, что proxy_buffering off для нас.
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://alma_app;
        proxy_http_version 1.1;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host $host;

        # **`X-Real-IP` — не украшение журнала.** `api/deps.request_source`
        # читает именно его, а `X-Forwarded-For` намеренно не читает: прокси его
        # *дописывают*, поэтому первый элемент цепочки — текст, сочинённый
        # вызывающим, и потолок по источнику снимается одной строкой заголовка.
        # `$remote_addr` — адрес сокета, который видит nginx, то есть настоящий
        # адрес клиента. Без этой строки все запросы мира приходят с адреса
        # прокси и складываются в один ключ: потолок бьёт по живым людям.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без него приложение считает, что его позвали по http, и собирает
        # ссылки возврата из кассы на http — то есть в никуда.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Живость. Отдельным location только ради тишины в журнале: проверка раз в
    # тридцать секунд — это 2880 строк в сутки, в которых тонет всё остальное.
    location = /health {
        proxy_pass http://alma_app;
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
